<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostalji Cenneti - Dijital DVD Arşivi</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 1em;
        }
        .player-box {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        video {
            width: 100%;
            max-height: 400px;
            border-radius: 5px;
            outline: none;
            background: #000;
        }
        .control-panel {
            background: #252525;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #444;
        }
        .control-panel h3 {
            color: #ffcc00;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.9em;
            color: #ddd;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1em;
        }
        .btn-add:hover {
            background: #218838;
        }
        .movie-list {
            margin-top: 20px;
            max-height: 220px;
            overflow-y: auto;
        }
        .movie-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c2c2c;
            padding: 10px 14px;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        .movie-row span {
            cursor: pointer;
            color: #4da6ff;
            font-weight: bold;
        }
        .movie-row span:hover {
            text-decoration: underline;
        }
        .btn-del {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-del:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nostalji Cenneti</h1>
        <div class="subtitle">En güzel eski filmler ve videolar</div>
        
        <!-- Oynatıcı Alanı -->
        <div class="player-box">
            <h3 id="playing-title" style="margin-top:0; color:#fff;">Dondurmam Gaymak</h3>
            <video id="videoPlayer" controls>
                <source src="dondurmam.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
        </div>

        <!-- Yönetim ve Ekleme Paneli -->
        <div class="control-panel">
            <h3>Arşive Yeni Film Ekle</h3>
            <div class="input-group">
                <label>Film Adı</label>
                <input type="text" id="movieTitle" placeholder="Örn: Hababam Sınıfı">
            </div>
            <div class="input-group">
                <label>Video Dosyası Seç (MP4)</label>
                <input type="file" id="movieFile" accept="video/mp4">
            </div>
            <button class="btn-add" onclick="addMovie()">+ Filmi Listeye Ekle</button>

            <div class="movie-list">
                <h4 style="color:#ccc; margin-top:15px; margin-bottom:8px;">Arşiv Listesi</h4>
                <div id="listContainer">
                    <!-- Filmler buraya gelecek -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let movies = [
            { title: "Dondurmam Gaymak", src: "dondurmam.mp4" }
        ];

        function updateList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            
            movies.forEach((m, idx) => {
                const row = document.createElement('div');
                row.className = 'movie-row';
                row.innerHTML = `
                    <span onclick="selectMovie(${idx})">▶ ${m.title}</span>
                    <button class="btn-del" onclick="removeMovie(${idx})">Sil</button>
                `;
                container.appendChild(row);
            });
        }

        function selectMovie(idx) {
            const player = document.getElementById('videoPlayer');
            const titleEl = document.getElementById('playing-title');
            player.src = movies[idx].src;
            titleEl.innerText = movies[idx].title;
            player.play();
        }

        function addMovie() {
            const titleBox = document.getElementById('movieTitle');
            const fileBox = document.getElementById('movieFile');

            if(fileBox.files.length === 0) {
                alert("Lütfen bir video dosyası seçin!");
                return;
            }

            const file = fileBox.files[0];
            const videoUrl = URL.createObjectURL(file);
            const title = titleBox.value.trim() !== "" ? titleBox.value.trim() : file.name;

            movies.push({ title: title, src: videoUrl });
            updateList();

            titleBox.value = "";
            fileBox.value = "";
        }

        function removeMovie(idx) {
            if(confirm("Bu filmi listeden silmek istiyor musun?")) {
                movies.splice(idx, 1);
                updateList();
            }
        }

        document.getElementById('movieFile').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                const name = e.target.files[0].name.replace(/\.[^/.]+$/, "");
                document.getElementById('movieTitle').value = name;
            }
        });

        updateList();
    </script>
</body>
</html>
